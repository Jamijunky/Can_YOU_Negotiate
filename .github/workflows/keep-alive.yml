name: Backend Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:      # Allow manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          # Pings the health check endpoint to prevent free tier spin-down
          curl -sf https://can-you-negotiate-agent.onrender.com/ > /dev/null || true
          echo "Pinged Render backend at $(date)"
