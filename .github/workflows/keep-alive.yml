name: Render Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:      # Allow manual trigger

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      # Only ping if the service is a web type (worker type does not serve HTTP)
      # This workflow is kept as a fallback; the primary warm mechanism is
      # Render's minInstances on the starter plan.
      - name: Ping Render Backend
        run: |
          curl -sf https://can-you-negotiate-agent.onrender.com/health > /dev/null || true
          echo "Pinged Render backend at $(date)"
