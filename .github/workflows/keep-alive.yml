name: Backend Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:      # Allow manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Fly.io Backend
        run: |
          # Fly.io machines stay alive when auto_stop_machines=false
          # This ping is a safety net in case the machine restarts
          curl -sf https://can-you-negotiate-agent.fly.dev/ > /dev/null || true
          echo "Pinged Fly.io backend at $(date)"
