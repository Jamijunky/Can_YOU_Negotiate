name: Backend Keep-Alive

on:
  schedule:
    - cron: '*/2 * * * *'  # Every 2 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: |
          curl -sf https://can-you-negotiate-agent.onrender.com/ > /dev/null || true
          echo "Pinged at $(date)"
