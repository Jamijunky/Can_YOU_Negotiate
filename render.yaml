services:
  # Backend LiveKit Agent Worker
  - type: worker
    name: can-you-negotiate-agent
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python agent.py start
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RIME_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8081"
    # Starter plan ($7/mo) keeps 1 instance always warm
    # This eliminates the 30-60s cold start that occurs on free tier
    # Free tier spins down after 15min of inactivity
    plan: starter
