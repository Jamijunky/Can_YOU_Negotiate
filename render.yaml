services:
  # Backend LiveKit Agent
  # Web type so health check pings prevent spin-down on free tier
  # Health check runs on PORT (10000), agent runs on 8081 (internal)
  - type: web
    name: can-you-negotiate-agent
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python agent.py start
    healthCheckPath: /
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RIME_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: HEALTH_PORT
        value: "10000"
      - key: AGENT_PORT
        value: "8081"
