services:
  # Backend LiveKit Agent Worker
  # NOTE: Fly.io is recommended over Render for free tier (no cold starts).
  # See backend/fly.toml for Fly.io configuration.
  # To deploy on Render instead, remove the plan line (free tier cold-starts).
  - type: worker
    name: can-you-negotiate-agent
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python agent.py start
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RIME_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8081"
